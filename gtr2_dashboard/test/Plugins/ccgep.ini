; Crew Chief GTR2 Enhancements Plugin Version: 6.0.0.0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Plugin Manual: https://thecrewchief.org/downloads/gtr2/GTR2_CC_EP.pdf
; Changelog and FAQ: http://thecrewchief.org/showthread.php?2012-GTR2-Setup-Instructions-and-Known-Issues&p=8180&viewfull=1#post8180
; Project Discord Server: https://discord.gg/BqPh6ubBR7
;
; This plugin fixes some known issues and adds the new features that enhance the original game.
;
; For most settings "0" means "Disable the Feature", "1" means "Enable the Feature".
;
; Many enhancements require matching content changes.  See the manual on how to update your cars/tracks to enable them.

; To restore default value for a particular setting, delete the setting and plugin will restore the default value
; the next time it runs.
;
; For the ease of viewing/editing this file, consider using the Notepad++.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[CONFIG]

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Miscellaneous
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; 0x0 - use all available logical processors (recommended)
;
; GTR2 default value is - 0x1 (single core, lower framerate).
;
; If for some reason you'd like to specify custom affinity mask,
; search online for "CPU affinity calculator".
changeProcessAffinity = 0x0

; The lower the value, the more precise spotter will be, but the higher CPU usage will be.
; Valid range [0.0, 0.5].  At the lowest value, which is 0.0 (data updated on every frame), perf impact is approximately 10% FPS.
; At 0.1-0.2 it is negligible.
; Put this to 0.5 to completely eliminate FPS impact or if you do not use the Crew Chief spotter.
;
; NOTE: this has no effect if physicsOfflinePlayerMode set to value other than 0.  In decoupled physics mode scoring update
; is as precise as possible.
scoringUpdateBoost = 0.200000

; Scales driver steering animation to a desired amount of degrees of rotation.
;
; If you want driver steering animation to match your physical wheel rotation, set this value
; to match your wheel lock to lock degrees (for example, 540 or 900).
;
; GTR2 driver animation is limited to 240 degrees, so animation will stop at +-120 degrees.
;
; NOTE: requires "Speed Sensitive Steering" at 0.00000 in the .plr file.
;
; Set to 0 disable the feature.
scaleDriverAnimationToPhysicalDegrees = 0

; Mute rFactor API telemetry while in garage and on first 0.5s upon entering the track.
enableMotionSystemMode = 0

; This setting primarily intended for modders who are updating their content to use
; the Enhanced features.  Saved .cchdc is a starting point for a car specific configuration.
;
; This setting also enables saving per-car overrides, such as ABS level.  To see what is supported,
; check out the [OVERRIDES] section of the saved file.
;
; NOTE: .cchdc file is not regenerated.  As Plugin evolves, you would need to regenerate .cchdc
; to expose the newly introduced feature settings.  See the manual for more details.
;
; Set to 1 to save current per-car settings to .cchdc file.
savePerCarSettings = 0

; Set to 1 to save per-car preferences to .cchdc-prefs file.
;
; Saved info includes per-car FFB adjustments, mirror/eyepoint adjustments etc.
savePerCarPreferences = 0

; Set to 1 to enable memory usage optimization.  This is highly experimental feature, so make sure
; you go over "Memory usage improvements" in the manual.
enableMemoryUsageOptimizations = 1

; Set to 1 if you want to use built-in spotter rather than Crew Chief.
disableRadioCommVolumeOverride = 0

; Set this to value lower than 0.01 (for example, 0.0025) to make seat adjustment step smaller.
overrideSeatAdjustStep = 0.010000

; Set this to 1 to disable minidump collection on crash.
disableCrashDump = 0

; Set this to 1 to disable GTR2 pausing on focus loss.
disablePauseOnFocusLoss = 1

; Set to a non-negative value between 0.0 and 1.0 to override GTR2 master volume in Windows Audio Mixer.
; This is useful for balancing the volume between GTR2 and CC application by making the overall game
; audio quieter without losing the balance of the individual game sounds.
;
; The value is a percentage of a current system volume.
;
; Set to -1.0 to disable master volume override.
overrideMasterVolume = -1.000000

; Full path of Custom Weather files to use.  See "Custom Weather Modes" in the manual.
customWeatherFilesPath = C:\Program Files (x86)\Steam\steamapps\common\GTR2_Common\custom_weather\

; If Custom Weather is in use, configure how CCGEP chooses which month's weather to use:
;
; 0    - use month from RaceDate value in track .gdb file
; 1-12 - use specific month
; 13   - use today's month
customWeatherMode = 5

; This settings enables the tune up mode for various CCGEP features:
;
; 0 - disable the tune up mode
; 1 - enable the Triple Screen tune up mode
; 2 - enable the VR Lens Flare tune up mode
;
; See the manual for each individual feature tune up usage.
enableFeatureTuneUpMode = 0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Rules
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Disable automatic speed limiter engagement on pit lane entry/exit.
rulesDisableAutomaticSpeedLimiter = 1

; Enable pit lane speed limit detection in all sessions (not only the Race session).
; To serve penalty in non-race session, return to the pits.
rulesEnablePitLaneSpeedLimitInAllSessions = 1

; Activate speed limiter in the garage stall.  Only applies to vehicles with limiter available
; and tracks with speed limit below 200km/h.
rulesActivateSpeedLimiterOnGarageExit = 0

; Override pit lane speed limit (km/h).  Set this to an unrealistically high value (400) to 
; effectively disable the speed limit.  Useful for simulating pre-1994 events.
;
; Set to 0 to keep the speed limit specified by the track.
rulesOverridePitLaneSpeedLimit = 0

; Issue a penalty for exiting the pits before exit light goes green.
rulesEnablePenaltyForExitingOnRed = 1

; Don't allow the game to automatically start the engine on exiting the garage.
rulesDisableAutomaticEngineStartOnGarageExit = 1

; Set to 1 to require headlights while driving in the dark.  After the first
; warning, player has 60 seconds to enable the headlights or get Disqualified.
rulesRequireHeadlightsInDark = 1

; Set to 1 to require headlights during the daytime.  This setting affects AI
; headlights use.
rulesRequireDaytimeHeadlights = 0

; Require headlights while driving in the rain.  The value is a threshold
; for on path wetness (0.0, 1.0] above which headlights are required.  This setting
; affects AI headlights use.
; Keep at 0.0 to disable the feature.
rulesRequireHeadlightsInRain = 0.000000

; How long it takes for rear wing to engage/disengage into/from DRS position.
rulesDRSEngageSpeedSeconds = 1.000000

; This feature tries to fix incorrect "You are ahead of SC" message during rolling start.
; This happens on tracks where grid starts ahead of s/f line. See "Authoring Fixes"
; section in the manual for more details.
rulesEnableSameLapRollingStartFix = 1

; Set to 1 to allow refuel with engine running.
rulesAllowRefuelWithEngineRunning = 0

; Set to 1 to disallow refuel in race.  Applies to player vehicle only.
rulesPlayerDisallowRefuelInRace = 0

; Set to value above 0.0 to override KERS engine torque boost.  Leave
; at 0.0 to use CCGEP defaults.
rulesKERSEngineTorqueBoostOverrideNM  = 0.000000

; Allows overriding the way race starting grid is formed.  Valid values:
;
; 0 - default game behavior
; 1 - freeze and use current qualification grid for race starting grid
rulesRaceGridFormationMode = 1

; Maximum number of laps under Safety Car (Full Course Yellow) phase.
; Useful at long tracks like Le Mans or Nordschleife.
;
; Set to 0 to keep the default game behavior.
rulesSafetyCarPhaseLapsMax = 2

; Maximum number of Safety Car phases per session.
;
; Set to 0 to keep the default game behavior.
rulesSafetyCarPhasePerSessionMax = 0

; Minimum cooldown in seconds between Safety Car phases.  CCGEP will
; suppress a new Safety Car phase if the last one went Green less than
; this number of seconds ago.
;
; Set to 0 to keep the default game behavior.
rulesSafetyCarPhaseCooldownSeconds = 0

; Formation Lap procedure variant.  Valid values:
;
; 0 - default game behavior (Rolling Start)
; 1 - Formation Lap followed by Standing Start (F1 style)
;
; Also see aiParkingOvershootBrakeDistanceMeters setting.
rulesFormationProcedureVariant = 0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; VR settings
; NOTE: requires CCGEP d3d9.dll and openvr_api.dll files.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Enables VR rendering.
enableSteamVRRendering = 0

; Enable Single Pass Stereo VR rendering.  Requires DXVK.
enableDXVKVRSinglePassStereo = 0

; If DXVK VR is in use, requests that plugin uses OpenXR runtime instead of SteamVR.
;
; Requires enableSteamVRRendering enabled or -ccvr command line switch passed.
enableDXVKVROpenXR = 0

; Enables a separate thread for OpenXR frame submission during loading screens.
; Provides smoother head tracking during track loading with SteamVR and possibly
; other OpenXR runtimes.  Bonus, if enabled, also allows re-centering the view
; during loading screens.
;
; Important: not all OpenXR runtimes support this well, so disable if it causes
; crashes or hangs during the loading screen.
enableDXVKVROpenXRLoadingThread = 0

; DXVK VR OpenXR resolution scale percentage, similar to SteamVR resolution.
DXVKOpenXRResolutionScale = 100

; Overrides the vertical FOV for VR stereo view (in degrees).
; Range: [60.0, 179.5], HMD-specific.
;
; Used to fix object culling near the view edges.  Use the smallest value that works.
;
; Set to 0.0 to disable the override and use FOV specified in defviews.cam.
stereoViewVerticalFOVDegrees = 110.000000

; Set to 1 to automatically re-center VR on startup.
enableVRRecenterOnStartup = 1

; Set this to 1 to disable the game HUD in DXVK OpenXR VR renderer.
disableDXVKVROpenXRHUD = 0

; Enabling this improves OpenVR performance with Pimax headset, but makes it 
; worse with Index.  Experiment to see what works better with your HMD.
;
; It also forces GTR2 to exit earlier than game does normally, because Pimax
; software sometimes blocks the game from shutting down.
enablePimaxMode = 0

; Submit explicit frame timing in DXVK mode.  This setting seems to improve
; Vive Pro 2 experience. Experiment to see what works better with your HMD.
;
; This setting applies to OpenVR only and has no effect in Pimax mode.
enableExplicitDXVKTiming = 0

; Experimental: do OpenVR WaitGetPoses after Submit. Experiment to see what
; works better with your HMD.
;
; This setting applies to OpenVR only.
enableWaitGetPosesAfterSubmit = 0

; Set to 1 to disable the VR Hidden Area Mask (in case it causes problems).
;
; NOTE: if you see the edges of HAM, you may want to try setting
; graphicsForceBlackClearColor to 1.
disableVRHAM = 0

; Sets distance to the menu/non-cockpit camera overlay.  Higher value moves
; overlay further, lower moves it closer.
menuOverlayDistance = 1.500000

; Sets vertical offset of the menu/non-cockpit camera overlay.  Higher value moves
; overlay up, lower moves it down.
menuOverlayVerticalOffset = 0.000000

; Sets curvature of the menu/loading/non-cockpit camera overlay.  Higher value makes
; overlay more curved, lower makes it less curved.
menuOverlayCurvature = 0.200000

; Scales the menu/non-cockpit camera overlay horizontally.  Higher value makes
; overlay wider, lower makes it narrower.
menuOverlayWidthScale = 1.000000

; Scales the menu/non-cockpit camera overlay vertically.  Higher value makes
; overlay taller, lower makes it shorter.
;
; Suggested values (assuming that menuOverlayWidthScale is at 1.0):
; * DucFreak UI (16:9 aspect ratio) - 0.5625
; * Stock UI (4:3 aspect ratio) - 0.75
;
; Also, see the related setting: graphicsAutoCalculate2DSqueezeForUI.
menuOverlayHeightScale = 0.562500

; Sets distance to the HUD overlay.  Higher value moves
; overlay further, lower moves it closer.
hudOverlayDistance = 1.500000

; Sets curvature of the HUD overlay.  Higher value makes
; overlay more curved, lower makes it less curved.
hudOverlayCurvature = 0.200000

; Scales the HUD overlay horizontally.  Higher value makes
; overlay wider, lower makes it narrower.
hudOverlayWidthScale = 1.000000

; Scales the HUD overlay vertically.  Higher value makes
; overlay taller, lower makes it shorter.
hudOverlayHeightScale = 1.000000

; Virtual key code to use for resetting the HMD view.  Default is VK_NUMPAD5.
; See https://docs.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes for vkey codes.
recenterHMDVirtualKey = 0x65

; Improves the lens flare effect rendering by moving the lens flare images closer to
; the center of a vision (positive value) or further out (negative value).  This avoids
; the double sun image.  Use "enableFeatureTuneUpMode = 2" to find value that works best with
; your HMD (it depends on the aspect ratio and whether panels are canted or not).
;
; Suggested values:
; * Pimax 5K/8K, large FOV, native mode: ~52.0 in SPS mode, ~36.0 in legacy VR mode.
; * Valve Index: ~19.0
; * Vive Pro 2: ~20.0
lensHOffsetPercentage = 0.000000

; NOTE: this setting does nothing in Single Pass Stereo VR mode.
;
; GTR2 Sun Lens Flare rendering math is currently not compatible with VR.  I was not able to make it
; render perfectly, but this setting offers some choices:
;
; 0 - legacy behavior (as introduced via CCGEP VR in 2020) that may cause lens flare to flicker,
;     especially under heavy GPU load.
;
; 1 - use right eye logic for both eyes.  This is the fastest rendering mode and should reduce the
;     flickering.  However, sun in the leftmost area of the view may go invisible earlier than it should.
;
; 2 - wait for GPU idle.  The most visually correct mode, but costs FPS when lens flare is visible.
;
; NOTE: Sun lens flare visibility detection is still not perfect (sun may be visible when it should not
;       be and vice versa).
lensRenderMode = 1

; VR convenience override used to extend the seat adjust range in .car file.  Range R is applied in
; the following way:
;
; MaxSeatRear=R
; MaxSeatFront=-R
; MaxSeatUp=R
; MaxSeatDown=-R
;
; Nice starting value is 0.5.
;
; Set this to 0.0 to disable the override and use values from the .car file.
; NOTE: this override works in 2D as well.
overrideVRMaxSeatRange = 0.000000

; VR convenience override used to force NightAmbientColour and NightFogColour 
; .gdb values.  Overriding those settings helps making night racing in VR darker.
; Stock values are way too bright for VR use.
;
; Suggested settings:
; * Pimax 5X XR - (9.0, 9.0, 9.0)
; * Oculus Q2 - (3.0, 3.0, 3.0)
;
; Valid values: [0.0, 255.0]
; Set this to (0.0, 0.0, 0.0) to disable the override and use value from the .gdb file.
overrideVRNightAmbientColour = (0.000000, 0.000000, 0.000000)

; VR convenience override used to force RainNightAmbientColour and RainNightFogColour 
; .gdb values.  Overriding those settings helps making night racing in VR darker.
; Stock values are way too bright for VR use.
;
; Suggested settings:
; * Pimax 5X XR - (6.0, 6.0, 6.0)
; * Oculus Q2 - (2.0, 2.0, 2.0)
;
; Valid values: [0.0, 255.0]
; Set this to (0.0, 0.0, 0.0) to disable the override and use value from the .gdb file.
overrideVRNightRainAmbientColour = (0.000000, 0.000000, 0.000000)

; VR convenience override used to force emissive RGB color on sky NIGHT material.
; Overriding this setting helps making night sky darker in VR, as by default it
; is way too bright.
;
; Suggested settings:
; * Pimax 5X XR / Oculus Q2 - (60.0, 60.0, 60.0)
;
; Valid values: [0.0, 255.0]
; Set this to (0.0, 0.0, 0.0) to disable the override and use material default values.
overrideVRNightSkyEmissiveRGB = (0.000000, 0.000000, 0.000000)

; VR convenience override used to force emissive RGB color on sky NIGHTR material.
; Overriding this setting helps making night rainy sky darker in VR, as by default it
; is way too bright.
;
; Suggested settings:
; * Pimax 5X XR / Oculus Q2 - (50.0, 50.0, 50.0)
;
; Valid values: [0.0, 255.0]
; Set this to (0.0, 0.0, 0.0) to disable the override and use material default values.
overrideVRNightRainSkyEmissiveRGB = (0.000000, 0.000000, 0.000000)

; NOTE: this setting does nothing in Single Pass Stereo VR mode.
;
; This setting enables experimental right eye rendering optimizations.  Tries to reduce
; CPU usage by minimizing the code running during the right eye render pass.
; This may cause issues.  Please report issues you notice at CCGEP Discord.
enableVRRightEyeOptimizations = 0

; Use those settings to adjust VR mouse cursor (red glove) to your liking.
cursorWidthScale = 1.000000
cursorHeightScale = 1.000000


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; FFB
;
; NOTE: all CCGEP FFB settings except:
;         - ffbDisableResetOnSessionTransition
;         - ffbRFPEnableKeys
;         - ffbLeoFFBAutoInitPerCarSettings
;       are reloaded on entering car, so you can tweak them without restarting the game.
;
; NOTE: to set those settings per car, put them into .cchdc file [FFB] section.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Steering Force FFB Mode:
; 0 - default GTR2 Steering Force FFB or FFB coming from external plugins.
; 1 - CCGEP Steering Force FFB.  Based on approach developed by Niels Heusinkveld.
ffbMode = 0

; CCGEP Steering Force FFB parameters:
; See the manual for details.
ffbCCGEPGain = -1.050000
ffbCCGEPPneumaticTrailNM = 0.000010
ffbCCGEPSuspensionTrailM = 0.050000
ffbCCGEPSuspensionScrubM = 0.030000
ffbCCGEPGripFractPower = 3.000000
ffbCCGEPCasterDegrees = 8.000000
ffbCCGEPKPIDegrees = 15.000000
ffbCCGEPSteeringArmLengthM = 0.150000

; Specifies which of the CCGEP Steering Force FFB parameters plugin should attempt
; getting from game physics:
;
; * Caster = 1
; * KPI = 2
;
; Add the above values to specify multiple parameters.  For example, to get both
; Caster and KPI from physics, set this to 3 (1 + 2).
ffbCCGEPAutoParamMask = 0

ffbCCGEPRampUpKMH = 10.000000
ffbCCGEPGamma = 1.000000

; "Parking lot" forces by Leo Bodnar.
ffbCCGEPLeoKf = 5000.000000
ffbCCGEPLeoKs = 7.000000
ffbCCGEPLeoA = 1.500000
ffbCCGEPLeoKr = 1.500000

; Rate of CCGEP DirectInput FFB decoupled effect updates.  Currently, affects:
;
; * Stationary Friction effect
; * Speed Sensitive Steering Friction effect
;
; The lower the value, the lower potential FPS impact caused by the above features is.
; However, setting this too low may cause effects to not feel smooth.
ffbDirectInputDecoupledUpdateFrequencyHz = 33.000000

; Stationary friction magnitude value, valid range is [0.0, 1.0].  Determines the amount of
; friction effect to apply.
;
; Important: if CCGEP Steering Force FFB or Real Feel Plugin or LeoFFB Plugin is used with
; Direct Drive wheel, then setting this to 1.0 is highly recommended. This helps suppressing
; oscillations at a standstill.  For further help with oscillations see ffbRampUpSeconds setting.
;
; Set to 0.0 to disable the effect.
;
; Requires the following .plr settings:
; "FFB Effects Level" 2 or higher.
; "FFB steer friction coefficient" and "FFB steer friction saturation" should not be at 0.0.
ffbStationaryFrictionMagnitude = 0.000000

; Speed km/h at which CCGEP stationary friction effect is disabled.
; Stationary friction force will drop linearly and disappear at max speed value.
;
; Requires ffbStationaryFrictionMagnitude set to a value higher than 0.0.
ffbStationaryFrictionMaxSpeedKMH = 40.000000

; Factor by how much power steering affects stationary friction force.  Set to 1.0
; for cars without power steering, otherwise set to a lower value.
;
; Plugin scales power steering force depending on the value of ffbPowerSteeringRunningRPM
; setting, which means that the amount of power steering force depends on the engine
; running RPMs.
;
; Requires ffbStationaryFrictionMagnitude set to a value higher than 0.0
; and/or CCGEP Steering Force FFB or RFP plugin v0.938 or v0.936 or LeoFFB v2.0
; configured to enable stationary friction.
ffbStationaryFrictionPowerSteeringFactor = 1.000000

; Engine RPM value at which to consider power steering effective enough to feel it.
;
; Reasonable starting value is couple of hundred RPMs above the engine idle value
; found in the .eng file.
ffbPowerSteeringRunningRPM = 1500.000000

; Experimental feature that disables FFB reset on session change.  Set this
; to 1 if you have some FFB effects disappearing upon entering the track.
ffbDisableResetOnSessionTransition = 0

; CCGEP disables Real Feel Plugin keys because they conflict with mirror/eyepoint adjustment keys.
; Set to 1 to enable RFP keys.
ffbRFPEnableKeys = 0

; How much .tyr file compound "Softness" parameter value will dynamically affect the CCGEP Steering
; Force FFB ffbCCGEPLeoKs force or Real Feel Plugin Ks force (tire stiffness).  Compounds softer than
; tiresBaseSoftness will get lower Ks force, harder compounds will get higher values.  As a result,
; different compounds will feel slightly different in FFB.  Good starting point (based on the "Softness"
; values I saw in mods) is 20.0.
;
; This also applies to LeoFFB plugin "wheel rubber hardness" parameter.
;
; Set this to 0.0 to keep ffbCCGEPLeoKs/Ks force from .ini file (or "wheel rubber hardness" from LeoFFB).
ffbRFPSoftnessKsWeight = 0.000000

; Set to 1 to enable automatic initialization of LeoFFB settings that depend on .sp/.tyr/.svm
; configuration of the car.  See the manual for more details.
ffbLeoFFBAutoInitPerCarSettings = 0

; Min speed at which to apply per-car steering FFB multiplier.  Set this
; to value above 0.0 if you want to preserve low speed forces.
ffbPerCarMultApplyMinSpeedKMH = 0.000000

; Specify FFB ramp up time in seconds.  Upon entering or resuming the realtime, steering FFB
; force is applied gradually.  This helps with DD wheels, avoiding strong punch on resuming
; and helps reducing risk of oscillation.
;
; 0.0 is game default behavior where FFB is applied immediately.
ffbRampUpSeconds = 0.000000

; Set to 1 to disable steering force FFB on time acceleration.  This helps avoiding violent FFB
; on DD wheels if time acceleration is activated accidentally.  Currently, canned effects
; are not suppressed.
ffbDisableOnTimeAcceleration = 0

; Scaled force multiplier allowing adjustment of steering FFB strength in rain.
; Set this to value higher than 1.0 to increase steering FFB force in rain.
; Set to 1.0 to disable the feature.
;
; Don't forget to keep "RoadWetGrip" .gdb setting similar between tracks used in your Championship,
; otherwise steering FFB force may vary too much between tracks.
;
; See "Wet steering FFB force multiplier" section in the manual for more details.
ffbWetSteeringForceMultiplier = 1.000000

; Magnitude of simple road bumps FFB effect.  Start with very low values like 0.001
; and increase gradually to find the value that works best for you.  Applies to all
; FFB methods.
ffbRoadBumpsMagnitude = 0.000000


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Tires
;
; NOTE: to set those settings per car, put them into .cchdc file.
;
; NOTE: plugin is tested at values of 1.0 or below, do not
; go much above 1.0 as physics will start falling apart.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Base compound "Softness" value to use in tire/FFB calculations.  Compound "Softness" is defined in .tyr files.
; Default is 0.55 which corresponds to "Medium" compound value in most mods.
tiresBaseSoftness = 0.550000

; Sets the maximum flat spot severity.  Set this to 0.0 to disable flat spots completely. 
; Anything above 0.0 enables the flat spot emulation.
;
; Recommended range is between 0.0 and 1.0.
tiresFlatSpotMaxSeverity = 0.200000

; Lower this value to slow down the flat spot build up, raise it to make tire more sensitive
; to wheel lockups.  You can go as high as you want on this.
tiresFlatSpotSensitivity = 1.000000

; This value defines how easily the first flat spot forms.  Lower this value
; to make it more easy to happen, set to 0.0 to remove the threshold completely. You may
; also want to disable this in series that allow ABS.
;
; Initial lockup is the important one, because once it happens, tire starts to decay
; faster and faster.  Threshold helps in preventing micro lockups from starting this process.
tiresFlatSpotInitialThreshold = 1.000000

; Magic value which affects how flat spot would feel, experiment with it
; to see what you like best.  Valid range is between 0.0 and 1.5
tiresFlatSpotMaxSize = 1.000000

; Another magic value exaggerates the flat spot as speed increases.
; If you set this to 0.0 flat spot stays identical no matter the speed.
tiresFlatSpotSpeedFactor = 1.000000

; This setting controls how easily tire locks up once it is flat spotted.
; Setting this to 0.0 disables secondary lockups.  The higher the value,
; the more likely secondary lockup in a flat spotted area will happen.
tiresFlatSpotSecondarySensitivity = 1.000000

; How much .tyr file compound "Softness" parameter value will affect the flat spot build up.
; Compounds softer than tiresBaseSoftness will get damaged more easily.
; Good starting point (based on the "Softness" values I saw in mods) is 2.0.
;
; Set this to 0.0 to ignore the "Softness" setting.
tiresFlatSpotSoftnessWeight = 0.000000

; Sets the maximum dirt pickup severity (how much effect dirty tires have on grip).
; Set this to 0.0 to disable dirt pickup completely.  Anything above 0.0 enables the dirt pickup emulation.
;
; Recommended range is between 0.0 and 2.0.
tiresDirtPickupMaxSeverity = 0.000000

; How quickly the dirt pickup builds up when tire is off track.  Higher value means faster build up.
; You can go as high as you want on this, and 0.0 will effectively disable the dirt pickup.
tiresDirtPickupSensitivity = 1.000000

; How quickly the dirt pickup wears off and grip goes back to normal.  Higher value means faster return
; to the normal grip.
; You can go as high as you want on this, and 0.0 means that dirt pickup will never clear off.
tiresDirtPickupWearOffRate = 1.000000

; Additional player tire wear multipliers.  Set to 0.0 to disable this feature.
tiresPlayerFrontWearMult = 0.000000
tiresPlayerRearWearMult = 0.000000


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Graphics
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Set the desired GTR2 window size (resolution) in pixels.  Keep values at 0 if you want to use
; Config.ini generated by GTR2Config.exe instead.
;
; This is the recommended way of setting the game resolution.  Using GTR2Config.exe is not
; recommended as that causes problems.
;
; Resolution can also be set via -ccvm-w:/-ccvm-h: command line switches.
;
; Fullscreen mode is not supported by CCGEP.
graphicsVideoModeWindowWidth = 1920
graphicsVideoModeWindowHeight = 1080

; Forces borderless window in windowed mode.  This allows fullscreen experience
; without breaking SimHub and VR overlays.
;
; Borderless mode can also be forced via -ccvm-bless command line switch.
graphicsForceBorderlessWindow = 1

; Reduces wall and tree flickering.
;
; This setting works best with DXVK, see the manual for further details.
graphicsEnableAdvancedFlickerFix = 1

; Experimental attempt to fix LCD screen missing on some systems.  It is still important to
; use graphicsVideoModeWindowWidth/graphicsVideoModeWindowHeight or command line switches to
; set the desired resolution and use DXVK if hardware allows.  Set to 1 to enable.
graphicsReject16BitSurfaces = 0

; Sets the horizontal angle in degrees for triple screen setups.  Requires additional setup,
; see "Triple Screen" section in the manual.
graphicsTripleScreenAngleDegrees = 0.000000
graphicsTripleScreenHorizontalCorrection = 0.000000
graphicsTripleScreenZoomCorrection = 1.000000

; Sets the percentage of the screen allocated to UI in 2D mode.  This is intended for
; triple screens and ultra wide monitors.  For triples, set it to 0.30 (30%) to begin with.
;
; Also, see the related setting: graphicsAutoCalculate2DSqueezeForUI.
;
; Setting this to 0.0 disables the feature.
graphics2DSqueezeUIPercentage = 0.000000

; Set to 1 to apply graphics2DSqueezeUIPercentage setting in VR.
;
; NOTE: if graphicsAutoCalculate2DSqueezeForUI feature is enabled, this will
; calculate needed VR overlay size, even if 2D window does not require squeeze.
; This helps matching exact UI aspect ratio, improving the scaling in VR mono views.
;
; See "VR UI Aspect Ratio settings" in the manual for more details.
graphicsApply2DSqueezeUIInVR = 0

; Plugin can calculate graphics2DSqueezeUIPercentage value that preserves correct UI aspect ratio
; based on the game window resolution and the UI selected.  Available choices:
;
; 0 - do not auto calculate 2D UI Squeeze
; 1 - calculate for default GTR2 UI (4:3 aspect ratio)
; 2 - calculate for default DucFreak UI (16:9 aspect ratio)
;
; If graphicsApply2DSqueezeUIInVR is set to 1, plugin will also calculate menuOverlayHeightScale
; automatically in order to ensure aspect correct UI in VR as well.
graphicsAutoCalculate2DSqueezeForUI = 0

; Set to 1 to make wipers clear the dirt screen.
; Requires car authored to support wipers as well.
graphicsWipersClearDirtScreen = 1

; Set to value higher than 0.0 (for example 0.5) to enable backfires on all cars.  The higher the
; value, the more likely backfire is to occur (max value is 1.0).
; NOTE: this could affect FPS.
graphicsBackfireOnAllCarsFrequency = 0.300000

; Set this to value higher than 1 to increase the resolution of rain reflections.  Only natural
; numbers are allowed (try 4 or 8 to see what this does).
graphicsRainReflectionResolutionFactor = 1

; Sets track rain reflections mode.
; 0 - game default track rain reflections
; 1 - disable track objects
; 2 - disable completely (fastest)
graphicsTrackRainReflectionMode = 0

; Sets cars rain reflections mode.
; 0 - game default car rain reflections
; 1 - disable car reflections
; 2 - disable processing completely (fastest if graphicsTrackRainReflectionMode is set to 2 as well)
graphicsCarRainReflectionMode = 0

; Enables additional Motec data pages.
; NOTE: For full compatibility, requires car authoring changes.
graphicsMotecEnableAdditionalDataPages = 1

; This setting allows hiding the individual data pages.  To define
; which pages you'd like to hide sum the values below:
;
; 0   - do not hide any data pages
; 1   - Lap Stats
; 2   - Oil/Water Temp and RPMs
; 4   - Tire Temps
; 8   - Brake Temps
; 16  - Tire Wear
; 32  - Tire Pressure
; 64  - Position
; 128 - Gaps Ahead/Behind
; 256 - Delta Page
;
; Example: 1 + 4 = 5, setting this value to 5 will hide Lap Stats
; and Tire Temps pages.
graphicsMotecDataPagesExcludeMask = 0

; Style defining how to display units in additional data pages.
; 0 - unit after each value
; 1 - unit under the page icon
graphicsMotecAdditionalDataPagesUnitsStyle = 0

; Enables alternative layout for Motec gaps data page.
graphicsMotecGapsDataPageMysteryManMode = 0

; Controls sensitivity of wheel lockup indicator in cars equipped with
; such indicator. Higher value -> more sensitive indicator.
graphicsMotecLockWarningSensitivity = 1.000000

; Controls sensitivity of wheel spin indicator in cars equipped with
; such indicator. Higher value -> more sensitive indicator.
graphicsMotecSpinWarningSensitivity = 1.000000

; Set to value higher than 0.0 to override cockpit and/or
; rear view LODMultiplier.  Keep value at 0.0 to use game values.
; Those values can be configured per-track in .ccgdb, see the manual on
; how to do it.
;
; Using high LODMultiplier value reduces objects popping in/out of the
; view, but has significant FPS cost.
graphicsCockpitLODMultiplier = 0.000000
graphicsRearViewLODMultiplier = 0.000000

; Set to 1 to enable rear view shadows.
graphicsEnableRearViewShadows = 0

; Set to value higher than 0.0 to force LODOut value on all track geometry.
; This may have less performance impact compared to LODMultiplier overrides.
; This value can be configured per-track in .ccgdb, see the manual on
; how to do it.
;
; This will reduce objects popping in/out of the view, but has
; significant FPS cost.
graphicsForceTrackLODOut = 0.000000

; Set to value higher than 0.0 to configure LODOut value for all the spectator characters.
;
; GTR2 has a bug where spectator characters LODOut is forced to a low value, causing
; them to pop in/out of the view.
graphicsSetSpectatorLODOut = 0.000000

; Set to value higher than 0.0 to override LODOUT value on all the pit crew characters
; and objects from .ani files in GameData\Scripts\crew.gtr.
graphicsForcePitCrewLODOut = 0.000000

; Set to 1 to allow eyepoint adjustment using Right Ctrl+Num4/Num6/Num2/Num8/Num7/Num9 keys.
graphicsEnableEyepointAdjKeys = 0

; Set to 1 to enable SUSPENSION .cas instance animation in all views.
graphicsAnimateSuspensionInstanceInAllViews = 0

; Force Black Clear color for all render targets.
graphicsForceBlackClearColor = 0

; Set to value above 0.0 to reduce AI brakelight flicker.  Good starting point is 1.0.
graphicsAIBrakeLightFlickerThresholdSeconds = 1.000000


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Gearbox
;
; NOTE: to set those settings per car, put them into .cchdc file.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Enables full offline support for extra 8th and 9th gears.  Enabling this feature
; is not recommended unless you are driving a car that is actually authored to
; have more than 7 forward gears.
;
; See "Gearbox Changes/Sequential/Extra Gears" section in the manual for an explanation
; of how to update cars and game UI to use more than 7 forward gears.
gearboxSequentialEnableExtraGears = 0

; Enables sequential gearbox overrev protection on downshift.  Plugin
; uses Engine RPM/Rev limit to decide whether to reject the downshift.
; Setting this above 1.0 will allow downshift above the rev limit.
; Setting this below 1.0 will make overrev protection engage below
; the rev limit.
;
; Suggested starting value is 1.1, which allows the downshift up to
; 10% above the RPM limit.
;
; To disable overrev protection, set this value to 0.0.
gearboxSequentialOverrevRPMLimit = 0.000000

; Refuses to change the gear to Neutral until vehicle is stopped.
; Set to 1 to enable, 0 to disable the feature.
gearboxSequentialBlockNeutralUntilStopped = 0

; Refuses to change the gear if less than specified number of
; milliseconds elapsed since the last shift.
gearboxSequentialDoubleShiftProtectionMillis = 0

; Refuses to upshift if effective engine torque is above the set value.
; For Skip Barber (rTrainer) start with 40.0.
; To disable the feature set it to 0.0.
gearboxSequentialLiftToUpshiftTorqueNM = 0.000000

; Refuses to downshift if effective engine torque is above the set value.
; For Skip Barber (rTrainer) start with 25.0.
; To disable the feature set it to 0.0.
gearboxSequentialLiftToDownshiftTorqueNM = 0.000000

; If engine RPM falls below this value, antistall is engaged.  If set to 0.0,
; antistall is disabled.  Good starting point for F1 car is ~4000.0 RPM.
;
; Requires auto clutch disabled in the game.
gearboxSequentialAntistallThresholdRPM = 0.000000

; Specifies how many seconds engine is allowed to run in antistall
; before it is turned off.  0 means it is allowed to run indefinitely.
gearboxSequentialAntistallEngineCutOffTime = 0

; This setting enables H-Shifted manual gearbox simulation.
;
; H-Shifted manual gearbox rev match sensitivity setting defines how closely
; revs should be matched for a clutchless shift.  To enable, set to 0.1,
; and lower/raise to make it less or more forgiving of the rev mismatch.
; Set to 0.0 to disable the feature.
gearboxHShiftedRevMatchTolerance = 0.000000

; Additional factor applied to gearboxHShiftedRevMatchTolerance on upshift.
; Setting this above 1.0 makes upshifts more forgiving of the rev mismatches.
gearboxHShiftedUpshiftRevMatchToleranceFactor = 2.000000

; Additional factor applied to gearboxHShiftedRevMatchTolerance on downshift.
; Setting this above 1.0 makes downshifts more forgiving of the rev mismatches.
gearboxHShiftedDownshiftRevMatchToleranceFactor = 1.000000

; Controls H-Shifted gearbox damage sensitivity.  To enable gearbox damage, set to 1.0,
; and lower/raise to make gearbox less/more fragile.  As gearbox is damaged you'll get
; more misshifts, and eventually DNF with the reason "Gearbox".
; Setting this to 0.0 disables the damage.
;
; Requires gearboxHShiftedRevMatchTolerance set to a value greater than 0.0.
gearboxHShiftedDamageSensitivity = 0.000000


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Physics
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; This feature overrides offline player physics/FFB and telemetry behavior.
; Parts of this feature still have some issues, see the manual for more details.
;
; Please note that this could break physics.  Settings above 400Hz are exposed
; purely for the experimentation purposes.
;
; 0 - game default behavior (physics is tied to FPS).
; 1 - decoupled 400Hz physics/FFB/telemetry independent of FPS.
; 2 - decoupled 800Hz physics/FFB/telemetry independent of FPS.
; 3 - decoupled 1600Hz physics/FFB/telemetry independent of FPS.
; 4 - decoupled 3200Hz physics/FFB/telemetry independent of FPS.
;
; NOTE: requires Windows 10 version 2004 (build number 19041), May 2020 Update or newer
; OS to function as intended.
physicsOfflinePlayerMode = 1

; Configures how aggressive decoupled physics mode is at ensuring precise timing.  Setting this
; to 1 enables most precise timing, but at a possible FPS cost.  Value of 0 enables more relaxed
; physics timing.
physicsDecoupledBusyWait = 1

; If this is set to 1, decoupled physics calculations are done only when game is not rendering the scene.
;
; This is compromise mode that is slightly less precise than fully decoupled physics, but rendering is 
; flawless that way.  This mode is especially useful in VR and in 2D mode with vsync or limiter on.
;
; physicsDecoupledVSyncMode = 0 is for experimentation only.  Do not report issues for this mode.
physicsDecoupledVSyncMode = 1

; If this is set to a value other than 0, inputs (steering wheel/pedals) are updated independently of the framerate,
; which combined with decoupled physics further increases accuracy of the calculations.  This also moves FFB and input
; processing off the graphics thread, which may increase FPS a bit.
;
; 0 - do not decouple inputs (input processing is tied to FPS).
; 1 - decoupled 200Hz input processing independent of FPS.
; 2 - decoupled 400Hz input processing independent of FPS.
; 3 - decoupled 800Hz input processing independent of FPS.
; 4 - decoupled 1600Hz input processing independent of FPS.
;
; NOTE:
; * This feature only works if offline decoupled physics is enabled (physicsOfflinePlayerMode setting).
; * Decoupled inputs rate should be less than or equal to the decoupled physics rate.
; * This could cause problems with some controls and should only be used in V-Sync mode (physicsDecoupledVSyncMode = 1).
; * Some controls won't work.  The workaround is to pause the game before using the control.
physicsDecoupledInputsMode = 0

; Experimental feature that allows overriding the AI physics processing rate.
;
; 0 - game default rate of 40Hz
; 1 - 80Hz
; 2 - 200Hz
; 3 - 400Hz
;
; NOTE: This feature only works if offline decoupled physics is enabled (physicsOfflinePlayerMode setting).
physicsAIMode = 0

; AI to AI collision rate per second used with physicsAIMode override.  Special value of 0 means
; processing rate that matches the AI physics rate.
physicsAIToAICollisionRate = 0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Modding
;
; Important: those features are intended for modding/diagnostics.  Don't enable while simply
; playing the game as they may lower the performance or cause problems.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Set to 1 to enable fast exit from GTR2 via "Ctrl+C" press.
moddingEnableFastExit = 0

; Set to 15 to substitute all the missing textures for a dummy texture.  If you want a more fine grained
; control, you could specify which texture tags are affected by the substitution:
;
; tag1 - 1
; tag2 - 2
; tag3 - 4
; tag4 - 8
;
; To enable substitution for textures with tags 1 and 3 set this option to 5 (1+4).  To substitute for
; all but tag 3, set it to 11 (1+2+8).
;
; See "Resource Creation Tracing" section in the manual.
moddingUseDummyForMissingTexturesMask = 0

; Log player vehicle info per lap.  Set to 1 to log at each physics tick, set to 2 to log at every other tick etc.
; Example: with physics at 800hz set to 4 to log at 200Hz.  Keep at 0 for no logging.  Lap is cutoff at xfinish.
;
; Requires: decoupled physics enabled.
;
; Remember: AI uses different physics, so logging AI or time accelerated data will produce useless results.
moddingLogPlayerLapInfo = 0

; Quickly find optimal offset values using M+Num4/Num6/Num2/Num8/Num7/Num9 keys.  Possible values:
;
; 0 - Disable Offset Tuning Mode
; 1 - FirstPersonDriverPosition .car setting
moddingOffsetTuningMode = 0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Pit Stops
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Override the refuel rate (liters per second).  Keep at 0.0 for the original game flow rate.
pitStopsRefuelRateLitersPerSecond = 0.000000

; Override the duration of individual pit stop services/repairs.  Keep it at 1.0 for the original
; game durations, or set it to values above 1.0 to accelerate them.
pitStopsFrontCompoundChangeAccelFactor = 1.000000
pitStopsRearCompoundChangeAccelFactor = 1.000000
pitStopsAeroRepairTimeAccelFactor = 1.000000
pitStopsSplitterRepairTimeAccelFactor = 1.000000
pitStopsRearWingRepairTimeAccelFactor = 1.000000
pitStopsSuspensionRepairTimeAccelFactor = 1.000000
pitStopsBrakesRepairTimeAccelFactor = 1.000000

; When set to 1, will skip player refueling animation if the following conditions are met:
; * pit stop is accelerated
; * tires are being changed
pitStopsSkipRefuelAnimation = 0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; AI
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; AI in-race first stint tire wear/fuel use adjustment percentage settings.
; Those settings may help preventing too many AI cars pitting on the same lap.
;
; * Set to positive value to decrease or increase AI tire wear/fuel use
;   within the specified percentage range.  For example, 10.0 will randomly
;   adjust values by +-10%.
;
; * Set to negative value to decrease AI tire wear/fuel use within the
;   specified percentage range.  For example, 10.0 will randomly decrease
;   values by 10%.
;
; * Keep at 0.0 to do nothing.
;
; Adjustments apply until the first in-race pit stop.
aiRaceFirstStintTireWearAdjustPct = 5.000000
aiRaceFirstStintFuelUseAdjustPct = 5.000000

; Set to 1 to enable AI in-race smart tire change delay logic.  The goal is to
; reduce the amount of weird AI pit stops, especially in rain racing.
;
; See the "Smart Tire Change Delay" section in the manual for more details.
aiRaceSmartTireChangeDelay = 1

; Distance (in meters) from the assigned parking position at which an AI car
; applies its brakes.  Currently used only during the Formation/Standing start
; procedure.
;
; Lower values if you want car to snap into its position.  Increase if you want
; to avoid snapping.  Note that too big value may cause cars to teleport into Garage.
aiParkingOvershootBrakeDistanceMeters = 4.000000


