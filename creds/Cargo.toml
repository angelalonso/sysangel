[package]
name = "creds"
version = "0.1.0"
edition = "2021"
description = "A simple credential manager for developers"
authors = ["Your Name <you@example.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/yourusername/creds"
keywords = ["secrets", "vault", "credentials", "password-manager"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "creds"
path = "src/main.rs"

[lib]
name = "creds"
path = "src/lib.rs"

[dependencies]
aes-gcm = { version = "0.10", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive"] }
rpassword = "7.2"  # For secure password input
indicatif = "0.17" # For progress bars
shellexpand = "3.1" # For ~ expansion
chrono = "0.4"

[dev-dependencies]
tempfile = "3.6"
