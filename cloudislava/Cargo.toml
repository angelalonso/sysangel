# Cargo.toml
[package]
name = "cloud-is-lava"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = "0.29"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
base64 = "0.21"
rpassword = "7.2"
zeroize = "1.6"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
bytes = "1.0"
getrandom = "0.2"
hex = "0.4"
dirs = "5.0"
