# Window settings
remember_window_size  no
# DOES NOT WORK: startup_mode maximized
window_border_width   0
hide_window_decorations yes
confirm_os_window_close 0

# Tab bar settings (simulating terminator tab behavior)
tab_bar_style hidden
# tab_bar_edge top
# tab_bar_style powerline
# tab_bar_min_tabs 1
# tab_title_template "{title}"
# active_tab_title_template "{title}"

# Font settings
font_family FantasqueSansMono Nerd Font Mono
font_size 14
bold_font auto
italic_font auto
bold_italic_font auto
adjust_line_height 104%

# Color scheme (Monokai Pro inspired)
foreground #eeeeec
background #000000
selection_background #fcfcfa
selection_foreground #000000

cursor #fcfcfa
cursor_text_color background

# Normal colors
color0 #000000
color1 #ef2929
color2 #8ae234
color3 #fcaf3e
color4 #729fcf
color5 #ad7fa8
color6 #78dce8
color7 #d3d7cf

# Bright colors
color8 #555753
color9 #ff7f7f
color10 #cbf0a6
color11 #fce94f
color12 #addbe2
color13 #eca0f8
color14 #97dfd6
color15 #eeeeec

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Mouse
copy_on_select yes
mouse_hide_wait 0

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Keyboard shortcuts (matching your terminator bindings)
map ctrl+c        copy_to_clipboard
map ctrl+v        paste_from_clipboard
map super+t       new_tab
map ctrl+shift+c  send_text all \x03

# Disable various navigation bindings that you had as None in terminator
map ctrl+shift+up    no_op
map ctrl+shift+down  no_op
map ctrl+shift+left  no_op
map ctrl+shift+right no_op
map ctrl+shift+k     no_op
map ctrl+shift+j     no_op
map ctrl+shift+h     no_op
map ctrl+shift+l     no_op
map ctrl+shift+enter no_op

# Tab navigation disabled as per your config
map ctrl+tab         no_op
map ctrl+shift+tab   no_op
map ctrl+shift+l     no_op
map ctrl+shift+.     no_op

# Layout/splitting disabled
map ctrl+shift+o     no_op
map ctrl+shift+e     no_op
map ctrl+shift+w     no_op
map ctrl+shift+q     no_op

# Start with your custom command
shell_integration enabled
# DOES NOT WORK: no-title
#login_shell yes
# Note: For custom command, you might want to create a wrapper script
# or set your shell to execute the command on startup
shell $HOME/Software/Dev/sysangel/files/tv
